; Other galaxies of the simulated sky (Vulkan client): small models of the
; Local Group's brightest, baked into the sky with the Milky Way's light,
; seen through its dust. Rounded published values; the structure is
; simplified to what the sky shows at a few arcminutes.
;
; GALAXY name  RA  Dec [deg, ICRS]  distance [pc]  M_V (total, dereddened)
;        inclination [deg]  position angle of the line of nodes / major
;        axis [deg, from north through east]
;   The disk's near side is at PA - 90 deg (inclination > 0) or PA + 90
;   (inclination < 0). Components follow, their light shares normalised
;   to 1 (colour: of a black body of the temperature [K]):
; DISK  scale length  scale height [pc]  share  T  [arms: number  pitch [deg]  contrast]
; BULGE scale (exponential) [pc]  height / radius  share  T   (spheroid about the disk's axis)
; BAR   RA  Dec (centre)  sigmas a  b  c [pc] (Gaussian)  PA of a on the sky [deg]  share  T
; KNOT  RA  Dec  sigma [pc]  share  T   (star-forming region)
; DUST  scale length  scale height [pc]  A_V per pc at the centre (or the ring)  [ring radius  ring sigma [pc]]
; MEMBERS  pm RA*  pm Dec [mas/yr]  tolerance [mas/yr]  radius [deg]  depth [pc]:
;   catalogue stars with these proper motions and no parallax, within the
;   radius, are the galaxy's (Utils/SkyKit/build_stars.py places them in its
;   disk's plane, spread along the line of sight by the depth)
; END
;
; Sources: McConnachie 2012 (AJ 144, 4): M_V, structure; Pietrzynski et al.
; 2019 (LMC distance); Graczyk et al. 2020 (SMC); Li et al. 2021 (M31);
; Breuval et al. 2023 (M33); van der Marel & Kallivayalil 2014 (LMC
; geometry); Kallivayalil et al. 2013 (proper motions); Courteau et al.
; 2011 (M31 bulge and disk).

