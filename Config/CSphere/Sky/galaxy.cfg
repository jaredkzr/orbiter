; Milky Way model of the simulated sky (Vulkan client)
;
; Galactocentric frame: x from the Galactic centre away from the Sun's
; side (the Sun is at x = -R0), y toward l = 90 deg, z toward the north
; Galactic pole [pc]. Azimuth beta is measured at the centre from the
; direction of the Sun, increasing in the direction of Galactic rotation
; (as in Reid et al. 2019).
;
; Stars: each component has a density shape and a stellar population
; (luminosity function below). Disk densities are relative to their value
; at the Sun; the bar's is relative to the local thin disk, at its centre.
; Dust: the Edenhofer et al. (2024) map within its coverage around the
; Sun, this model beyond.

; --- geometry
R0          8150     ; Sun's distance from the centre [pc] (Reid et al. 2019)
ZSUN        20.8     ; Sun's height above the mid-plane [pc] (Bennett & Bovy 2019)

; --- stellar components
;           name    population  scale length [pc]  scale height [pc]  local fraction  arm contrast  hole [pc]
DISK        young   young       2600               70                 1.0             6.0           3000
DISK        thin    thin        2600               220                1.0             0.4           3000
DISK        thick   old         2000               900                0.06            0.0           0
;           name    population  core [pc]  power  flattening  local fraction
HALO        halo    old         1000       2.5    0.7         0.0015
;           name    population  x0 [pc]  y0 [pc]  z0 [pc]  angle [deg]  central density
BAR         bulge   old         1490     580      400      27           20
; outer edge of the disks: density falls off as exp(-(R - EDGE)/EDGE_SCALE) beyond
EDGE        13000   1500

; --- spiral arms (Reid et al. 2019, table 2), extrapolated as log spirals
; over beta_min..beta_max (wherever 3 kpc < R < 17 kpc), fading over 20 deg
;      name    beta_kink  R_kink  psi<   psi>   width  beta_min  beta_max  stars
ARM    3kpcN   15         3520    -4.2   -4.2   180    -25       55        0.3
ARM    3kpcF   195        3520    -4.2   -4.2   180    155       235       0.3
ARM    Norma   18         4460    -1.0   19.5   140    -60       140       0.5
ARM    SctCen  23         4910    14.1   12.1   230    -200      200       1.0
ARM    SgrCar  24         6040    17.1   1.0    270    -200      200       0.5
ARM    Local   9          8260    11.4   11.4   310    -40       70        0.5
ARM    Perseus 40         8870    10.3   8.7    350    -200      200       1.0
ARM    Outer   18         12240   3.0    9.4    650    -120      140       0.5
; arm width grows with radius [pc per kpc] (Reid et al. 2014)
ARM_WIDTH_GROWTH  42

; --- dust beyond the map
;           mid-plane A_V at the Sun [mag/pc]  scale length [pc]  scale height [pc]  arm contrast  hole [pc]
DUST        0.0006                              3000               110                3.0           2500
; the map's coverage: blend from the map to the model between these radii [pc]
DUST_MAP    1700    1990
; extinction curve A(band)/A(V) at the band centres (Cardelli et al. 1989, R_V = 3.1)
EXTINCTION  1.40    1.12    0.94    0.80

; --- nebulae: the gas and dust around the catalogue's luminous stars, lit
; by them. Hot stars ionise the gas out to where their ionising photons are
; used up (emission nebulae); every luminous star's light is scattered by
; the dust around it (reflection nebulae).
; ionised gas: hydrogen density per dust [cm^-3 per A_V/pc] (N_H / A_V =
; 2.2e21 cm^-2 mag^-1, Gueaver & Oezel 2009), least density [cm^-3], largest
; radius of an ionised region [pc]
NEB_GAS      716    0.1    150
; natal clouds: young hot stars sit in the dense gas they formed from (too
; small for the dust map), a core and an envelope: central density
; [cm^-3] and the share of the star's ionising photons each takes (the rest
; ionise the gas around)
NEB_CLOUD    1000   0.3    30     0.4
; clumps below the dust map's resolution (log-normal): sigma of the log
; density per unit of noise, largest wavelength [pc]
NEB_CLUMP    1.5    4.0
; dust grains: albedo, scattering asymmetry g (visual; Draine 2003); and the
; dust close about a hot star the map misses (the star's own extinction,
; from its colour, beyond the map's): the scale of its shell [pc] (densest
; at half of it: the star clears its surroundings)
NEB_DUST     0.65   0.55   1.0
; stars brighter than M_V (first) light the dust out to where they look as
; bright as a star of this magnitude (second)
NEB_LIGHT    -1.0   -5.0

; --- spectral bands of the sky [nm]: (lower, upper) edges
BANDS       380 460   460 540   540 620   620 720

