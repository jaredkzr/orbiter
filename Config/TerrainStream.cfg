; Streamed terrain: sources of planetary tiles finer than the installed
; texture archives. Tiles are made on demand and kept in Cache/Terrain
; (size limit: TerrainCacheGB in Orbiter.cfg; TerrainStreaming = FALSE
; switches streaming off).
;
; SOURCE <body> <Surf|Elev> <encoding> <maxzoom> <minlevel> <latmin> <latmax> <lngmin> <lngmax> <id> <url> <attribution>
;   encoding: rgb (image tiles), terrarium (elevation encoded as
;     (R*256 + G + B/256) - 32768 [m]), or s2cog (Sentinel-2 reflectance
;     mosaics in cloud-optimised GeoTIFF cells of 1x1 degree; maxzoom is
;     then the finest Orbiter level, and the url has {cell} (e.g. N28W081)
;     and {latband} (e.g. N28))
;   maxzoom: finest zoom level of the source (Web Mercator, 256 pixel tiles);
;     surface tiles are made up to Orbiter level maxzoom+2, elevation up to
;     maxzoom+3
;   minlevel: coarsest Orbiter level to make (coarser ones come from the
;     installed archives)
;   latmin..lngmax: coverage [deg]; tiles must lie within it
;   url: {z}, {x}, {y} are replaced by the tile's zoom level and indices
;
; Only data that may be freely used and redistributed (public domain or
; open licences with attribution).

; Elevation: Tilezen terrain tiles (Amazon open data): USGS 3DEP (bare
; earth, ~10 m) in the United States, SRTM (~30 m) and others elsewhere
SOURCE Earth Elev terrarium 14 10 -85 85 -180 180 tilezen https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png Terrain tiles: Mapzen/Tilezen, USGS 3DEP, SRTM, GMTED2010, ETOPO1 and others (open data)

; Imagery: USGS National Map (NAIP aerial imagery, public domain), the
; contiguous United States
SOURCE Earth Surf rgb 17 12 24.5 49.4 -124.8 -66.9 usgs-imagery https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x} Imagery: USGS The National Map (public domain)

; Imagery elsewhere: ESA WorldCover 2021 Sentinel-2 composite (10 m,
; CC BY 4.0), up to level 16; no-data areas (open water) get a sea colour
SOURCE Earth Surf s2cog 16 12 -60 84 -180 180 worldcover-s2 https://esa-worldcover-s2.s3.eu-central-1.amazonaws.com/rgbnir/2021/{latband}/ESA_WorldCover_10m_2021_v200_{cell}_S2RGBNIR.tif Imagery: ESA WorldCover project 2021, contains modified Copernicus Sentinel-2 data (CC BY 4.0)
