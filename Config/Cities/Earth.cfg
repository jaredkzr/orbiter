; Procedural cities of Earth (Src/Orbiter/Cities.h)

; city centres from the night lights (Utils/Cities/hotspots.py)
CENTRES Earth_centres.txt

; known downtowns: where the skylines are
DOWNTOWNS Earth_downtowns.txt

; STYLE <name> <key>=<value> ...
;   block=<s>:<t>     street spacing along the grid's two axes [m]
;   street=<m>        street width
;   jitter=<x>        street positions moved by up to this share of a block
;   warp=<m>:<scale>  street grid warped by up to <m> over <scale> m (organic layouts)
;   spread=<deg>      grid orientations within this of north (-1: any)
;   house=<w>:<d>     detached houses: footprint [m]
;   houselot=<m>      ... lot width
;   housestoreys=<x>  ... mean storeys (1-2)
;   storey=<m>        storey height
;   low=<a>:<b>       storeys of low-rise rows
;   mid=<a>:<b>       storeys of mid-rise blocks
;   perimeter=<x>     share of mid-rise blocks built round their edges (courtyards)
;   highrise=<x>      share of dense blocks outside cores with apartment towers
;   industrial=<x>    share of fringe blocks with sheds
;   park=<x>          share of blocks left open
;   towers=<x>        factor on the height of the towers in city cores
STYLE generic   block=140:100 street=12 jitter=0.15 warp=25:500 spread=-1 house=11:9 houselot=18 housestoreys=1.5 low=2:3 mid=4:7 perimeter=0.2 highrise=0.05 industrial=0.08 park=0.06 towers=0.8
