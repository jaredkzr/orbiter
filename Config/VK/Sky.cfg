; Settings of the simulated sky (Vulkan client)
;
; Orbiter's celestial sphere options (Orbiter.cfg) also apply:
;   EnableBackgroundStars  the stars drawn as points
;   StarPrm                its second value: the faintest star drawn as a
;                          point (V); the fainter stars join the diffuse light
;   EnableBackgroundImage  the diffuse light: the Milky Way, the nebulae, the
;                          other galaxies and the zodiacal light
;   CSphereBgIntensity     its brightness (0.3: as measured)

; Realistic: the sky as the dark-adapted eye sees it.
; Enhanced: as a long-exposure photograph: a camera's colours (a nebula's
; H-alpha red), the diffuse light's contrast raised and its colours
; deepened (the stars as they are).
DisplayMode = Realistic

; Enhanced display: contrast of the diffuse light (1: as it is), where its
; highlights are compressed (relative to the Milky Way's mean brightness:
; a nebula's core keeps its colour), its saturation (1: as it is) and gain
; [stops]
EnhancedContrast = 2.0
EnhancedHighlights = 20
EnhancedSaturation = 1.8
EnhancedGain = 1

; Parts of the diffuse light
Nebulae = TRUE
Galaxies = TRUE        ; the other galaxies and the globular clusters
ZodiacalLight = TRUE

; GPU time per frame for computing the sky again after the observer has
; moved far [ms] (only where the graphics card has no separate compute
; queue: else the sky is computed alongside the rendering)
BakeBudget = 2.0
