; Jupiter's cloud decks (see README.txt): the upper haze (photochemical,
; yellow-brown, about the tropopause, optical depth ~0.3: it tints the
; sky above the clouds), ammonia ice (white zones, near 0.7 bar; the belts' brown
; from the planet map's chromophores), ammonium hydrosulfide (~2 bar,
; brown-orange: chromophores absorbing the blues), water ice and droplets
; (~5 bar, white, convective, lightning), after the Galileo probe and models
; of equilibrium condensation. Clear air between the decks, clearings in
; them, and storm towers rising through all of them
LAYER  45e3   90e3   5.0e-6  200e3  0.95    0.82    0.58     1.0  0.3  0  0.0
LAYER   2e3   22e3   8.0e-4   25e3  0.99990 0.99980 0.99939  0.75 0.6  0  0.35
LAYER -45e3  -28e3   6.0e-4   15e3  0.99813 0.98872 0.95908  0.75 0.3  0  0.45
LAYER -110e3 -80e3   5.0e-4    8e3  0.99994 0.99994 0.99990  0.6  0.0  1  0.2
HAZE   0.96 0.90 0.78  3.0e-7  30e3
; the gas (H2, He) and the aerosols mixed in it: absorption (chromophores:
; the blues most; methane hardly in the visible), Rayleigh scattering per bar
GAS    0.06 0.09 0.15   0.055 0.09 0.19
; the storms' vortices: swirl speed [m/s], core radius, tower spin [m/s],
; spiral twist [rad]
VORTEX 120 0.3 40 3.0
TOWERTOP 70e3
STRETCH 1.2
TINT 0.6
