; Jupiter's cloud decks (see README.txt): the upper haze (photochemical,
; pale, about the tropopause, optical depth ~0.2), ammonia ice (white zones,
; near 0.7 bar; the belts' brown from the chromophores over its tops: the
; planet map's colours), ammonium hydrosulfide (~2 bar,
; brown-orange: chromophores absorbing the blues), water ice and droplets
; (~5 bar, white, convective, lightning), after the Galileo probe and models
; of equilibrium condensation. Clear air between the decks, clearings in
; them, and storm towers rising through all of them
LAYER  45e3   90e3   5.0e-6  200e3  0.97    0.92    0.82     1.0  0.3  0  0.0
LAYER   2e3   22e3   8.0e-4   25e3  0.99990 0.99980 0.99939  0.75 0.45  0  0.35
LAYER -45e3  -28e3   6.0e-4   15e3  0.99813 0.98872 0.95908  0.75 0.3  0  0.45
LAYER -110e3 -80e3   5.0e-4    8e3  0.99994 0.99994 0.99990  0.6  0.0  1  0.2
HAZE   0.96 0.90 0.78  3.0e-7  30e3
; the gas (H2, He) and the aerosols mixed in it: absorption (clear above the
; clouds: their colours the map's; deeper, below 1 bar, the blues absorbed
; most), Rayleigh scattering per bar
GAS    0.05 0.065 0.085   0.055 0.09 0.19   0.012 0.03 0.075 1.0
; the storms' vortices: swirl speed [m/s], core radius, tower spin [m/s],
; spiral twist [rad]
VORTEX 120 0.3 40 3.0
TOWERTOP 70e3
STRETCH 1.2
TINT 0.3
; the chromophores over the ammonia deck's upper part (its hills paler,
; rising through them), the flow's folds and lanes (Juno's marbled belts),
; and the decks drawn from 10000 km down (seamless from the map)
CHROMO 12e3 30e3 0.85
FOLDS 1.0 1.0
REACH 10000e3
; small convective domes over the ammonia deck (Juno: dense about storms)
POPUPS 1.0
