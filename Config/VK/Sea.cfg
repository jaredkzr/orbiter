; Sea state of the bodies with open water (Vulkan client, visual only).
; The waves follow the core's wind model (oapiGetModelWind) 10 m above the
; water: its speed sets the sea state (glassy below about 1 m/s, a rough sea
; above 10), its direction the waves' (they run downwind, as smoke and spray
; drift). The model's wind is the same on every body: 4.5 m/s at the sea.
;
; A body's section sets the speed instead (the model's direction kept; on a
; body without wind data, no atmosphere, the waves run east):
;   [<body name>]          e.g. [TRAPPIST-1 e]
;   Wind = <m/s>           wind 10 m above the water, 0 to 25
; ORBITER_VK_SEA_WIND=<m/s> overrides every body (tests).
;
; (no sections: every body with water has an atmosphere and takes the
; model's wind)
