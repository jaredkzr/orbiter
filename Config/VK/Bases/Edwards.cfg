; Lights of Edwards for the Vulkan client (base frame [m]: x south, y up, z east)
; FLOODLIGHT x y z  dx dy dz  range[m]  r g b  umbra penumbra [deg]
; r g b: the lamp's brightness (its glow; about 6 for a xenon flood). As a light it gives r g b x 0.01
; of sunlight (VObjects.cpp FLOOD_IRRADIANCE) out to a fifth of the range, the inverse square beyond
; (made by Utils/BaseKit/basekit.py: floodlights about the pad)
FLOODLIGHT -2650 25 2000  -0.989 0.148 0.000  400  6 5.6 5  30 50
FLOODLIGHT -2850 25 2000  0.989 0.148 0.000  400  6 5.6 5  30 50
FLOODLIGHT -2750 25 1900  -0.000 0.148 0.989  400  6 5.6 5  30 50
FLOODLIGHT -2750 25 2100  -0.000 0.148 -0.989  400  6 5.6 5  30 50
