; The seas of the bodies with open water (core: Src/Orbiter/Sea.h).
; A body has a sea only if it has a section here: its water floats, slows
; and loads vessels (buoyancy, water entry), and its swell is shared by the
; physics and the graphics client (which draws the shorter waves itself).
;
;   [<body name>]           e.g. [TRAPPIST-1 e]
;   Wind = <m/s>            wind 10 m above the water, 0 to 25 (default: the
;                           core's wind model, 4.5 m/s at the sea; its
;                           direction is kept). Sets the sea state: glassy
;                           below about 1 m/s, a rough sea above 10.
;   Density = <kg/m^3>      the liquid (default 1025, sea water)
;   Viscosity = <m^2/s>     kinematic viscosity (default 1.19e-6, sea water at 15 C)
;   FloorDepth = <m>        the nominal seabed below the surface, where the
;                           data have no bathymetry (default 40)
;   ShelfSlope = <ratio>    the seabed's rise towards the shore (default 0.02)
;   SwellMinWavelength = <m> the swell's shortest wave (default 4)
;   Seed = <n>              the swell's seed (default: from the body's name)
;
; ORBITER_SEA_WIND=<m/s> overrides every body's wind (tests);
; ORBITER_NO_WATER=1 turns the seas off (the surface is ground, as before).

[Earth]
Wind = 7.0   ; the global mean 10 m wind over the oceans (scatterometers: about 7 m/s)

[Proxima b]
Wind = 8.0   ; tidally locked: the climate models' near-surface flow towards the substellar point, 5-15 m/s

[TRAPPIST-1 e]
Wind = 8.0   ; as Proxima b

[TRAPPIST-1 f]
Wind = 6.0   ; as Proxima b, in its denser 2 bar air (assumed atmosphere): a little calmer
