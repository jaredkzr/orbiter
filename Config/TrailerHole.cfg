; === A black hole for the trailer shot: 600 solar masses, spin 0.8 ===
; (its horizon ~1,400 km in radius; its tides tear a delta-glider apart
; ~13,000 km out - about 14.5 M, where its shadow and ring span ~40 deg -
; Scenarios: Tests/Audio/TrailerTides.scn)
Name = TrailerHole
Mass = 1.193082e33   ; [kg]
Spin = 0.8
Obliquity = 0        ; the spin axis: the ecliptic's north (the glider falls along it, clear of the disc)
LAN = 0
Size = 1.4e6         ; (set to the horizon's radius)
AccretionRate = 1e-12 ; [Eddington] a faint thin disc: ~4,400 K at its hottest - warm, not blown out white
DiscOuter = 30       ; [M] (small: seen face-on from the axis a wide disc floods the view)
DiscGlow = 0         ; (only its hot inner parts glow)
