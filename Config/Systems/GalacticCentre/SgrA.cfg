; === Sgr A*: the Milky Way's central black hole ===
; Mass: GRAVITY Collaboration (2020), A&A 636, L5: 4.261e6 Msun at their
; R0 = 8246.7 pc; at the sky model's R0 = 8150 pc the S-stars' orbits (their
; sizes in arcseconds) give 4.113e6 Msun (M scales as R0^3): that, the
; orbits and the mass consistent. Its spin
; is not known: assumed 0.9, the axis towards the Sun (a disc seen nearly
; face on, as the Event Horizon Telescope's image (2022) suggests). Its
; accretion flow is hot and thin, faint for its mass: a faint disc here
Name = SgrA
Catalogue = Galactic_Centre
Mass = 8.1783e36       ; [kg] 4.113e6 Msun
Spin = 0.9             ; a/M (assumed)
Obliquity = 1.4731     ; the axis towards the Sun: ecliptic longitude 86.85, latitude +5.61 deg
LAN = -0.0551
Size = 8.721e9         ; (the horizon's radius)
AccretionRate = 2e-9   ; [Eddington] (~300 Lsun)
DiscOuter = 1000       ; [M]
