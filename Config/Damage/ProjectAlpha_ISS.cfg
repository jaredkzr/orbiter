; Structure of the International Space Station (see README.txt)
; built for the loads of reboosts and dockings in orbit (fractions of a g),
; not for flight in an atmosphere, and never landing. The solar array wings
; are fragile: a spacecraft of the Delta-glider's mass bumping into one at
; about 1 m/s tears it off. The modules and the truss are sturdier, but
; give way at about 4 m/s - before a Delta-glider's nose does (about 5 m/s).
LOADFACTOR 1
LANDINGLOAD 0     ; (no gear: it never lands)
STRENGTH 3.5e5    ; [N] at least, the joints between modules and truss segments (inner ones
                  ; carry more mass beyond them: from the load factor)

; the eight array wings, on the truss at x = +-34 m (inner) and +-50 m
; (outer), reaching forward (+z) and aft (-z) in the plane y = -1.5 m;
; light (about 1.1 t a wing), not their share of the mass by area, and
; nothing hangs from them
PART left_solar_array_1_forward  BOX -42 -4 4  -26 1 39    MASS 1100 STRENGTH 3.5e4 LEAF
PART left_solar_array_1_aft      BOX -42 -4 -4  -26 1 -39  MASS 1100 STRENGTH 3.5e4 LEAF
PART left_solar_array_2_forward  BOX -58 -4 4  -42 1 39    MASS 1100 STRENGTH 3.5e4 LEAF
PART left_solar_array_2_aft      BOX -58 -4 -4  -42 1 -39  MASS 1100 STRENGTH 3.5e4 LEAF
PART right_solar_array_1_forward BOX 26 -4 4  42 1 39      MASS 1100 STRENGTH 3.5e4 LEAF
PART right_solar_array_1_aft     BOX 26 -4 -4  42 1 -39    MASS 1100 STRENGTH 3.5e4 LEAF
PART right_solar_array_2_forward BOX 42 -4 4  58 1 39      MASS 1100 STRENGTH 3.5e4 LEAF
PART right_solar_array_2_aft     BOX 42 -4 -4  58 1 -39    MASS 1100 STRENGTH 3.5e4 LEAF
