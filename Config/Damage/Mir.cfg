; Structure of the Mir space station (see README.txt)
; built for the loads of reboosts and dockings in orbit (fractions of a g),
; not for flight in an atmosphere, and never landing. The solar array wings
; are fragile: a spacecraft of the Delta-glider's mass bumping into one at
; about 1 m/s tears it off. The modules are sturdier, but give way at about
; 4 m/s - before a Delta-glider's nose does (about 5 m/s).
LOADFACTOR 1
LANDINGLOAD 0     ; (no gear: it never lands)
STRENGTH 3.5e5    ; [N] at least, the joints between modules (inner ones carry more
                  ; mass beyond them: from the load factor)

; the ten array wings (mesh group 036PANEL), in pairs either side of the
; modules they are mounted on (clear of the module walls); light (about
; 0.5 t a wing), and nothing hangs from them
PART aft_left_solar_array        BOX -16.6 -1.2 -9.8   -2.3 1.4 -7.4   MASS 500 STRENGTH 3.5e4 LEAF
PART aft_right_solar_array       BOX 2.3 -1.2 -9.8     16.6 1.4 -7.4   MASS 500 STRENGTH 3.5e4 LEAF
PART left_solar_array            BOX -14.4 -1.6 3.4    -2.3 1.6 6.6    MASS 500 STRENGTH 3.5e4 LEAF
PART right_solar_array           BOX 2.3 -1.6 3.4      14.4 1.6 6.6    MASS 500 STRENGTH 3.5e4 LEAF
PART forward_left_lower_array    BOX -12.9 -9.2 7.6    -2.3 -5.9 10.9  MASS 500 STRENGTH 3.5e4 LEAF
PART forward_right_lower_array   BOX 2.3 -9.2 7.6      12.8 -6.0 10.9  MASS 500 STRENGTH 3.5e4 LEAF
PART forward_left_upper_array    BOX -12.1 6.7 7.7     -2.3 9.9 10.9   MASS 500 STRENGTH 3.5e4 LEAF
PART forward_right_upper_array   BOX 2.3 6.7 7.7       12.2 9.9 10.9   MASS 500 STRENGTH 3.5e4 LEAF
PART forward_left_radial_array   BOX -12.5 -17.4 7.8   -1.5 -10.3 10.8 MASS 500 STRENGTH 3.5e4 LEAF
PART forward_right_radial_array  BOX 1.5 -17.4 7.8     12.5 -10.4 10.8 MASS 500 STRENGTH 3.5e4 LEAF
