; Default ground scatter of Ice-class worlds (see Src/Orbiter/GroundScatter.h)
; Used by Ice-class procedural worlds without a Config/Scatter/<body>.cfg (TRAPPIST-1 f, g, h): none on open water or slush.
; Analogue: Europa: glazed ice blocks, the Ice set.
; TINT auto brings each set to the world's own surface colours (SurfaceColours);
; boulders of 1.2 m and more are obstacles.

TINT auto 0.80 0.85 0.617 0.680 0.730
ASSETS Ice_rocks.cfg
;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.5     0.012   200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0004  2500  1       slope
