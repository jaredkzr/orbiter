; Default ground scatter of Ocean-class worlds (see Src/Orbiter/GroundScatter.h)
; Used by Ocean-class procedural worlds without a Config/Scatter/<body>.cfg (Proxima b, TRAPPIST-1 e): land only, none on water, sea ice or snow.
; Analogue: Titan cobbles (water-rounded, up to 0.8 m) and Earth granite, weathered and rounded; Titan's two dirty-ice blocks are left out.
; TINT auto brings each set to the world's own surface colours (SurfaceColours);
; boulders of 1.2 m and more are obstacles.

TINT auto 0.45 0.85 0.386 0.366 0.332
ASSETS Titan_rocks.cfg size=0:0.8
TINT auto 0.45 0.85 0.125 0.122 0.114
ASSETS Earth_rocks.cfg
;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.5     0.015   200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0003  2500  1       slope
