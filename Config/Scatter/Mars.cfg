; Ground scatter of Mars (see Src/Orbiter/GroundScatter.h)
; Ventifacts, sandstone slabs, basalt blocks and float after the rover
; images: rocks on the plains, more on slopes; boulders of 1.2 m and more
; are obstacles.

ASSETS Mars_rocks.cfg

;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.2     0.04    200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0008  2500  1       slope
