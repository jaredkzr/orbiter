; Default ground scatter of Lava-class worlds (see Src/Orbiter/GroundScatter.h)
; Used by Lava-class procedural worlds without a Config/Scatter/<body>.cfg (none yet).
; Analogue: Venus: platy basalt, the Venus set.
; TINT auto brings each set to the world's own surface colours (SurfaceColours);
; boulders of 1.2 m and more are obstacles.

TINT auto 0.45 0.60 0.122 0.109 0.089
ASSETS Venus_rocks.cfg
;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.5     0.050   200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0005  2500  1       slope
