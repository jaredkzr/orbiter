; Default ground scatter of Desert-class worlds (see Src/Orbiter/GroundScatter.h)
; Used by Desert-class procedural worlds without a Config/Scatter/<body>.cfg (none yet).
; Analogue: Mars: wind-carved ventifacts, sandstone, float and basalt, the Mars set.
; TINT auto brings each set to the world's own surface colours (SurfaceColours);
; boulders of 1.2 m and more are obstacles.

TINT auto 0.45 0.80 0.220 0.153 0.125
ASSETS Mars_rocks.cfg
;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.2     0.030   200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0006  2500  1       slope
