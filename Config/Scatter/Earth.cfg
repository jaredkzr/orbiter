; Ground scatter of the Earth (see Src/Orbiter/GroundScatter.h)
; Rocks on bare ground, trees in forests, shrubs and grass where the
; surface texture is green (none on water, snow or steep slopes). Boulders
; of 1.2 m and more and trees are obstacles.

ASSETS Earth_rocks.cfg

; plants (made by the graphics client):
;     kind  name          height trunk  latitudes [deg]
PLANT TREE  spruce        16     0.26   45 68
PLANT TREE  fir           12     0.19   40 65
PLANT TREE  pine          14     0.22   30 62
PLANT TREE  oak           11     0.33    0 55
PLANT TREE  poplar        16     0.29   30 55
PLANT TREE  birch         10     0.14   45 68
PLANT TREE  acacia         7     0.21    0 30
PLANT SHRUB shrub_round   1.4    0       0 65
PLANT SHRUB shrub_spread  1.1    0       0 60
PLANT SHRUB shrub_tall    2.2    0       0 60
PLANT GRASS grass0        0.4    0       0 70
PLANT GRASS grass1        0.4    0       0 70
PLANT GRASS grass2        0.4    0       0 70
PLANT GRASS grass3        0.4    0       0 70
PLANT GRASS grass4        0.4    0       0 70
PLANT GRASS grass5        0.4    0       0 70

;     name     kind  min   max  cell spacing density range collide cover
LAYER rocks    ROCK  0.0   1.2  16   1.5     0.008   200   0       bare
LAYER boulders ROCK  1.2   99   64   8.0     0.0003  2500  1       bare
LAYER trees    TREE  0.0   99   64   4.5     0.035   2000  1       forest
LAYER shrubs   SHRUB 0.0   99   32   2.5     0.03    400   0       bush
LAYER grass    GRASS 0.0   99   8    0.5     1.5     60    0       meadow
