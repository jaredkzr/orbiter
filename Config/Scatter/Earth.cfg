; Ground scatter of the Earth (see Src/Orbiter/GroundScatter.h)
; Rocks on bare ground, trees in forests, shrubs and grass where the
; surface texture is green (none on water, snow or steep slopes), cacti and
; desert bushes on dry ground. Boulders of 1.2 m and more, trees and
; saguaros are obstacles.

ASSETS Earth_rocks.cfg

; plants (made by the graphics client): kind, name, height [m], trunk
; radius [m], options (lat=, lng=: ranges [deg]; cover=: habitat)
PLANT TREE  spruce        16     0.26   lat=45:68 cover=forest
PLANT TREE  fir           12     0.19   lat=40:65 cover=forest
PLANT TREE  pine          14     0.22   lat=30:62 cover=forest
PLANT TREE  oak           11     0.33   lat=0:55  cover=forest
PLANT TREE  poplar        16     0.29   lat=30:55 cover=forest
PLANT TREE  birch         10     0.14   lat=45:68 cover=forest
PLANT TREE  acacia         7     0.21   lat=0:30  cover=forest
PLANT SHRUB shrub_round   1.4    0      lat=0:65  cover=bush
PLANT SHRUB shrub_spread  1.1    0      lat=0:60  cover=bush
PLANT SHRUB shrub_tall    2.2    0      lat=0:60  cover=bush
PLANT GRASS grass0        0.4    0      lat=0:70  cover=meadow
PLANT GRASS grass1        0.4    0      lat=0:70  cover=meadow
PLANT GRASS grass2        0.4    0      lat=0:70  cover=meadow
PLANT GRASS grass3        0.4    0      lat=0:70  cover=meadow
PLANT GRASS grass4        0.4    0      lat=0:70  cover=meadow
PLANT GRASS grass5        0.4    0      lat=0:70  cover=meadow
; desert: cacti only in the Americas, where they are native; desert bushes
; everywhere dry
PLANT TREE  saguaro       9      0.32   lat=23:35 lng=-116:-108 cover=arid
PLANT SHRUB barrel        0.8    0      lat=10:42 lng=-125:-35 cover=arid
PLANT SHRUB pricklypear   1.2    0      lat=0:45  lng=-125:-35 cover=arid
PLANT SHRUB creosote      1.5    0      lat=15:45 cover=arid
PLANT SHRUB sagebrush     0.9    0      lat=25:50 cover=arid

;     name     kind  min   max  cell spacing density range collide cover
LAYER rocks    ROCK  0.0   1.2  16   1.5     0.008   200   0       bare
LAYER boulders ROCK  1.2   99   64   8.0     0.0003  2500  1       bare
LAYER trees    TREE  0.0   99   64   4.5     0.035   1500  1       forest
LAYER shrubs   SHRUB 0.0   99   32   2.5     0.03    400   0       bush
LAYER grass    GRASS 0.0   99   8    0.5     1.5     60    0       meadow
LAYER cacti    TREE  0.0   99   64   8.0     0.002   1500  1       arid
LAYER desert   SHRUB 0.0   99   32   3.0     0.02    400   0       arid
