; Default ground scatter of Rock-class worlds (see Src/Orbiter/GroundScatter.h)
; Used by Rock-class procedural worlds without a Config/Scatter/<body>.cfg (Barnard b-e, TRAPPIST-1 b-d, Proxima d: all airless).
; Analogue: the Moon: impact fragments, blocks and breccia, the Moon set (Utils/ScatterAssets).
; TINT auto brings each set to the world's own surface colours (SurfaceColours);
; boulders of 1.2 m and more are obstacles.

TINT auto 0.45 1.00 0.147 0.141 0.138
ASSETS Moon_rocks.cfg
;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.5     0.020   200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0006  2500  1       slope
