; Ground scatter of the Moon (see Src/Orbiter/GroundScatter.h)
; Blocks and breccia after the Apollo landing sites: rocks on the regolith,
; more of them on slopes and crater walls; boulders of 1.2 m and more are
; obstacles.

ASSETS Moon_rocks.cfg

;     name     kind min   max  cell spacing density range collide cover
LAYER rocks    ROCK 0.0   1.2  16   1.5     0.02    200   0       slope
LAYER boulders ROCK 1.2   99   64   8.0     0.0006  2500  1       slope
