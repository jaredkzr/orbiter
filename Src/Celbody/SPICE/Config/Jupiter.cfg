; === Configuration file for planet Jupiter ===
Name = Jupiter
Module = spice
Body = JUPITER
Origin = SUN
Barycenter = JUPITER BARYCENTER
ParentBarycenter = SSB
Interval = 7000 ; Error < 0.5m

; === Physical Parameters ===
;Mass = 1.8986111e+27           ; mass [kg]
Mass = 1.898611062576457e27    ; JUP365 GM=1.266865319003704E+08 km^3/s^2
Size = 6.9911e+7               ; mean radius [m]
; https://agupubs.onlinelibrary.wiley.com/doi/epdf/10.1029/2019GL086572
JCoeff = 14696.5735e-6 -0.0450e-6 -586.6085e-6 -0.0723e-6       ; coefficient for gravitational potential
AlbedoRGB = 1.24 1.22 1.14

; === Rotation and precession parameters ===
; IAU_JUPITER
SidRotPeriod =  35729.71135186885
SidRotOffset =  4.193162722652337
Obliquity =  -0.016948574567499687
LAN =  1.589860219836502
LAN_MJD =  51544.5
PrecessionPeriod =  151989599.0568502
PrecessionObliquity =  -0.03508415165913837
PrecessionLAN =  -0.8408676938167512

; === Atmospheric Parameters ===
AtmPressure0 = 1e5             ; at the 1-bar level (altitude 0)
AtmDensity0 = 0.1677           ; at the 1-bar level
AtmGasConstant = 3615          ; specific gas constant of H2/He [J/(K kg)]
AtmGamma = 1.4                 ; specific heat ratio c_p/c_v
AtmAltLimit = 3200e3           ; raised to enable aerobrake capture.
;AtmHorizonAlt = 199e3         ; horizon rendering altitude [m] old 2570e3
AtmColor0 = 0.37 0.35 0.39     ; ? 0.46 0.26 0.13 +2 0.38 0.31 0.30
AtmHazeColor = 0.21 0.10 0.10  ; 0.35 0.35 0.39    0.46 0.26 0.13
AtmHazeDensity = 0.09
AtmHazeExtent = 0.055          ; 0.022
AtmHazeShift = 0.009

; === Cloud parameters ===
CloudAlt = 480e3 ; 800e3 altitude of cloud layer...below equals 'crushed like bug'
CloudRotPeriod = 0 ; 35727.3 ; 9.92425 hours
CloudShadowDepth = 0.8
CloudMicrotextureAlt = 1535e3 6440e3 ;1535e3 3440e3

; === Data for the Visual ===
TileFormat = 2
CloudFormat = 2
MaxPatchResolution = 6         ; highest sphere patch level
MinCloudResolution = 1 ; cloud layer from this resolution
MaxCloudResolution = 6 ; highest cloud resolution level

; === Gas giant: deep atmosphere, winds, no solid surface (Src/Orbiter/GasGiant.h) ===
; Jupiter (Galileo probe: 166 K at 1 bar, winds from 100 to 170 m/s below the clouds; jets after Voyager/Cassini)
GasGiant = TRUE
GGTemp1 = 165                 ; temperature at the 1-bar level [K] (dry adiabat below)
GGTropopauseTemp = 110        ; [K]
GGCrushPressure = 23e5         ; [Pa] vessels are crushed beyond (damage model on; Config/Damage CRUSHPRESSURE per class)
GGWindDeep = 0.7               ; jets' increase below the clouds (reached at GGWindDeepAlt)
GGWindDeepAlt = -60e3
GGWindDecay = 50e3              ; [m] the jets' decay above the clouds
GGStormDensity = 0.25          ; share of active convective storm cells
GGStormSize = 1.5e+06           ; [m] storm cell size
GGStormUpdraft = 40            ; [m/s]
GGStormTurbulence = 15         ; [m/s]
GGJets = -90 0 -70 10 -64 -15 -58 35 -51 -10 -47 40 -40 -20 -35 50 -29 -40 -26 45 -20 -60 -16 30 -11 90 -6 120 0 90 6 120 11 60 15 -30 18 -40 22 90 24 150 27 -20 31 40 38 -15 43 30 47 -10 53 40 56 -15 60 25 66 -10 70 10 90 0   ; zonal wind at the clouds: latitude [deg], eastward [m/s]
