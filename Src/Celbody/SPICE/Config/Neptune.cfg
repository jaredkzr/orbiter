; === Configuration file for planet Neptune ===
Name = Neptune
Module = spice
Body = NEPTUNE
Barycenter = NEPTUNE BARYCENTER
ParentBarycenter = SSB
Origin = SUN
Interval = 17000 ; Error < 0.5m

; === Physical Parameters ===
;Mass = 1.024569e+26
Mass = 1.024355200305071e26     ; NEP095 GM=6.835102266003616E+06 km^3/s^2
Size = 2.4624e7                ; mean radius
JCoeff = 0.004                 ; J2 coefficient for gravitational potential
AlbedoRGB = 0.68 0.91 1.25

; === Rotation Elements ===
; IAU_NEPTUNE
SidRotPeriod =  57996.0
SidRotOffset =  1.0611654885108948
Obliquity =  0.591115007710323
LAN =  3.901190689896669
LAN_MJD =  51544.5
PrecessionPeriod =  15951423.904352069
PrecessionObliquity =  0.14116830724828794
PrecessionLAN =  -0.08404086327549913

;=== Atmospheric Parameters ===
AtmPressure0 = 1e5             ; at the 1-bar level (altitude 0)
AtmDensity0 = 0.4222           ; at the 1-bar level
AtmGasConstant = 3290          ; specific gas constant of H2/He [J/(K kg)]
AtmGamma = 1.4                 ; specific heat ratio c_p/c_v
AtmAltLimit = 1800e3
AtmHorizonAlt = 110e3          ; horizon rendering altitude [m]
AtmColor0 = 0.28 0.57 0.83
AtmHazeColor = 0.38 0.43 0.73
AtmHazeDensity = 1.5
AtmHazeExtent = 0.14

; === Data for the Visual ===
MaxPatchResolution = 6         ; highest sphere patch level


; === Gas giant: deep atmosphere, winds, no solid surface (Src/Orbiter/GasGiant.h) ===
; Neptune (Voyager: retrograde equator near 400 m/s)
GasGiant = TRUE
GGTemp1 = 72                 ; temperature at the 1-bar level [K] (dry adiabat below)
GGTropopauseTemp = 52        ; [K]
GGCrushPressure = 23e5         ; [Pa] vessels are crushed beyond (damage model on; Config/Damage CRUSHPRESSURE per class)
GGWindDeep = 0.3               ; jets' increase below the clouds (reached at GGWindDeepAlt)
GGWindDeepAlt = -60e3
GGWindDecay = 50e3              ; [m] the jets' decay above the clouds
GGStormDensity = 0.08          ; share of active convective storm cells
GGStormSize = 2.0e+06           ; [m] storm cell size
GGStormUpdraft = 20            ; [m/s]
GGStormTurbulence = 12         ; [m/s]
GGJets = -90 0 -70 250 -50 100 -20 -300 0 -400 20 -300 50 100 70 250 90 0   ; zonal wind at the clouds: latitude [deg], eastward [m/s]
