; === Configuration file for planet Uranus ===
Name = Uranus
Module = Uranus
ErrorLimit = 1e-6
SamplingInterval = 3490        ; interpolation sampling interval [s]
                               ; (interpolation error ~1m)
; === Physical Parameters ===
Mass = 8.6832054e+25
Size = 2.5362e7                ; mean radius
JCoeff = 0.012                 ; J2 coefficient for gravitational potential
AlbedoRGB = 1.06 1.27 1.21

; === Rotation and precession parameters ===
; ref: see www.orbiter-forum.com/showthread.php?t=8185
LAN = 2.925986535
Obliquity = 1.436025521
SidRotOffset = 0.5200623232
SidRotPeriod = -62064
;SidRotPeriod (days): -0.7183333333

; === Ring Parameters ===
RingMinRadius = 1.335          ; inner radius of ring system
RingMaxRadius = 2.005          ; outer epsilon ring radius

;=== Atmospheric Parameters ===
AtmPressure0 = 1e5             ; at the 1-bar level (altitude 0)
AtmDensity0 = 0.4177           ; at the 1-bar level
AtmGasConstant = 3150          ; specific gas constant of H2/He [J/(K kg)]
AtmGamma = 1.4                 ; specific heat ratio c_p/c_v
AtmAltLimit = 2600e3
AtmHorizonAlt = 260e3          ; horizon rendering altitude [m]
AtmColor0 = 0.19 0.41 0.40
AtmHazeColor = 0.42 0.55 0.57
AtmHazeDensity = 1.5
AtmHazeExtent = 0.16
 
; === Data for the Visual ===
MaxPatchResolution = 6         ; highest sphere patch level

; === Gas giant: deep atmosphere, winds, no solid surface (Src/Orbiter/GasGiant.h) ===
; Uranus (Voyager/Keck: retrograde equator, prograde jets near 60 degrees)
GasGiant = TRUE
GGTemp1 = 76                 ; temperature at the 1-bar level [K] (dry adiabat below)
GGTropopauseTemp = 53        ; [K]
GGCrushPressure = 23e5         ; [Pa] vessels are crushed beyond (damage model on; Config/Damage CRUSHPRESSURE per class)
GGWindDeep = 0.3               ; jets' increase below the clouds (reached at GGWindDeepAlt)
GGWindDeepAlt = -60e3
GGWindDecay = 50e3              ; [m] the jets' decay above the clouds
GGStormDensity = 0.08          ; share of active convective storm cells
GGStormSize = 2.0e+06           ; [m] storm cell size
GGStormUpdraft = 20            ; [m/s]
GGStormTurbulence = 10         ; [m/s]
GGJets = -90 0 -60 250 -30 50 -20 -20 0 -80 20 -20 30 50 60 250 90 0   ; zonal wind at the clouds: latitude [deg], eastward [m/s]
