name: On Push (Linux)

on:
  push:
    branches:
      - main
    paths-ignore: [ 'Doc/**', 'Flights/**', 'Html/**', 'Images/**', 'Localdoc/**', 'Textures/**', 'Textures2/**']
  pull_request:
    branches:
      - main
    paths-ignore: [ 'Doc/**', 'Flights/**', 'Html/**', 'Images/**', 'Localdoc/**', 'Textures/**', 'Textures2/**']
  workflow_dispatch:

jobs:
  build:
    name: Headless build and tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    # The headless build simulates without graphics client. The legacy
    # VSOP87/ELP82 ephemeris modules are used, since the SPICE kernels are
    # not part of the repository.
    - name: Configure
      run: cmake --preset linux-x64-headless-release -DORBITER_SPICE_CELBODIES=OFF

    - name: Build
      run: cmake --build --preset linux-x64-headless-release

    - name: Test
      run: ctest --preset linux-x64-headless-release --output-on-failure
