# Mission Control's replies (Src/Orbiter/Audio/Radio.cpp): the moments of the flight the ground answers,
# and with which takes - Sound/Voice/Ground/<takes>_<c1|c2>_<n>.flac (lines.txt), by the CAPCOM on shift.
#
#   <moment> | <takes>        "none": not answered
#
# When a moment is (FlightState follows the flight; a vessel's code tells its own: oapiAudioEvent) and how
# long the ground takes (the light's round trip, a moment to answer) are the code's.

Liftoff     | Liftoff        # a rocket's (lit on its pad, its engines up), not a plane's
MaxQ        | MaxQ
MECO        | MECO
Orbit       | Orbit
Ignition    | Ignition
Deorbit     | Deorbit
Reentry     | Reentry        # entry interface
AOS         | AOS            # through the blackout (none made: NASA's clip)
Splashdown  | Splashdown
Landed      | Landed         # home from space
Surface     | Surface        # down on another world
Capture     | Capture
Escape      | Escape
Descent     | Descent        # a powered descent on an airless world
Approach    | Approach       # a docking port within 1 km
Docked      | Docked
Undocked    | Undocked
BoosterSep  | BoosterSep
TankSep     | TankSep
DeepSpace   | DeepSpace      # leaving Earth's sphere for the Sun's
LOS         | LOS            # the signal lost (the vessel gone)
Lost        | Lost           # ... near the ground
