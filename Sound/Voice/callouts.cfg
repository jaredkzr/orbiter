# The crew's lines (Src/Orbiter/Audio/Callouts.cpp, CrewLines.h). When each is said is the code's
# (FlightState follows the flight; the voice paces itself); what is said, and how, is here:
#
#   <key> | <file> | <priority> | <wait> [| <gain> [| <cooldown>]]
#
#   key       a name of the line: XRSound's where it has one ([SOUND_FILES] in XRSound's cfgs:
#             a vessel class's cfg, or a vessel's code through XRSound, may give its own file,
#             or "none": switched off)
#   file      the line (under the Orbiter folder). XRSound's default recordings are named as
#             XRSound names them - add-ons, scripts and audio.callouts () know them so - and
#             spoken in Orbiter's voice (Sound/Voice/<name>.flac) unless "Callout voice" is
#             XRSound's. A group (...Group): the folder of its lines (<base>.wav, .ogg, .flac,
#             .mp3). "{n}": one of the lines numbered 1 to 9 there are
#   priority  normal, or warning: said before the others waiting, its cue first (the caution
#             chirp; the master alarm for damage)
#   wait      [s] how long it may wait for its turn, then it's dropped (an altitude called late
#             is wrong)
#   gain      its level (1: a callout's; the commander's chatter is quieter)
#   cooldown  [s] not said again within this (none: as often as its moment comes; the
#             altitudes' and warnings' own pacing is the code's)

