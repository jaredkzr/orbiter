#--------------------------------------------------------------------------
# XRSound Configuration File -- overrides for DeltaGlider-s (DG-S class) vessels.
#
# For XRSound Version 3.0.
#
# See 'XRSound-DeltaGlider.cfg' for documentation about these settings.
#
# D. Beachy, 31-Jul-2021
#--------------------------------------------------------------------------

[VESSEL]
#--------------------------------------------------------------------------
# Specified this vessel's thruster indexes of the engines tied to the 
# CustomEngines sound defined in XRSound.cfg.  For the DG-S, these are 
# the SCRAM engines.  Thruster indexes are separated by spaces.
#
# Default (for DG-S): 0 1  
#--------------------------------------------------------------------------
CustomEnginesThrusterIndexes = 0 1

#--------------------------------------------------------------------------
# Custom engines sound; this is vessel-specific, and is tied to the thrusters
# specified via the 'CustomEnginesThrusterIndexes' setting in a given vessel
# class's XRSound-<class>.cfg file.
# Sound ID = 10014
# Default = XRSound\Default\Scramjet.wav
#--------------------------------------------------------------------------
CustomEngines = XRSound\Default\Scramjet.wav

[SOUND_FILES]

#--------------------------------------------------------------------------
# Callout played when the ship's landing gear touches down.
# Sound ID = 10021
# Default (for DG-S) = XRSound\Default\Wheels Down.wav
#--------------------------------------------------------------------------
Touchdown = XRSound\Default\Wheels Down.wav

#--------------------------------------------------------------------------
# Callout played when the ship's landing gear lifts off.
# Sound ID = 10022
# Default (for DG-S) = XRSound\Default\Wheels Up.wav
#--------------------------------------------------------------------------
Liftoff = XRSound\Default\Wheels Up.wav

#--------------------------------------------------------------------------
# RCS jets attack (open) sounds.
# Sound IDs = 10040 - 10045
#--------------------------------------------------------------------------
RCSAttackPlusX = XRSound\Default\RCS Open.wav
RCSAttackPlusY = XRSound\Default\RCS Open.wav
RCSAttackPlusZ = XRSound\Default\RCS Open.wav
RCSAttackMinusX = XRSound\Default\RCS Open.wav
RCSAttackMinusY = XRSound\Default\RCS Open.wav
RCSAttackMinusZ = XRSound\Default\RCS Open.wav

#--------------------------------------------------------------------------
# RCS jets close (release) sounds.
# Sound IDs = 10046 - 10051
#--------------------------------------------------------------------------
RCSClosePlusX = XRSound\Default\RCS Shut.wav
RCSClosePlusY = XRSound\Default\RCS Shut.wav
RCSClosePlusZ = XRSound\Default\RCS Shut.wav
RCSCloseMinusX = XRSound\Default\RCS Shut.wav
RCSCloseMinusY = XRSound\Default\RCS Shut.wav
RCSCloseMinusZ = XRSound\Default\RCS Shut.wav

#--------------------------------------------------------------------------
# RCS jets sustain (looping) sound.
# Sound ID = 10008
#--------------------------------------------------------------------------
RCSSustain = XRSound\Default\RCS Sustain.wav

#--------------------------------------------------------------------------

# Orbiter's own sound synthesizes the DG's motors, hydraulics, latches and
# the gear's lock (the DG module tags its animations: oapiAudioAnimation),
# so only the voice's callouts are left here, in the headset (Radio).

# Landing Gear
[animation_7]
OpenCloseSoundID = 12002
    PlaybackType = Radio
Opening = XRSound\Default\Gear Down.wav
   Open = XRSound\Default\Gear Down and Locked.wav
Closing = XRSound\Default\Gear Up.wav
 Closed = XRSound\Default\Gear Up and Locked.wav
IsLandingGear = 1

# Escape hatch
[animation_13]
OpenCloseSoundID = 12010
    PlaybackType = Radio
   Open = XRSound\Default\Hatch Open.wav
 Closed = XRSound\Default\Hatch Closed.wav
